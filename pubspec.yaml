name: mon_app_facturation
description: Application de gestion, stock et facturation
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.1
  intl: ^0.19.0
  uuid: ^4.2.1
  mobile_scanner: ^5.1.0      # Scanner de code-barres
  image_picker: ^1.0.4         # Pour choisir les images des produits
  fl_chart: ^0.66.0            # Graphiques
  shared_preferences: ^2.2.2
  pdf: ^3.10.8                 # Génération PDF (reçus)
  printing: ^5.12.0

flutter:
  uses-material-design: true